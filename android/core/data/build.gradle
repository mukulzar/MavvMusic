plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mavvmusic.core.data'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
    }

}

dependencies {
    implementation project(':core:domain')
    implementation project(':core:model')
    implementation project(':core:database')
    api "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttpVersion"
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:$rootProject.ext.serializationVersion"
    implementation "com.github.MetrolistGroup.innertubex:innertubex:v0.11.6"
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.26.5"
    implementation "io.ktor:ktor-client-okhttp:3.6.0"
    implementation "io.ktor:ktor-client-content-negotiation:3.6.0"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.6.0"
    implementation "com.google.dagger:hilt-android:$rootProject.ext.hiltVersion"
}
