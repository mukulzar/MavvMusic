buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.21"
        media3Version = "1.8.0"
        roomVersion = "2.8.5"
        lifecycleVersion = "2.9.2"
        coroutinesVersion = "1.10.2"
        hiltVersion = "2.60.1"
        okhttpVersion = "4.12.0"
        serializationVersion = "1.8.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")
        classpath("com.google.dagger:hilt-android-gradle-plugin:$hiltVersion")
    }
}

subprojects {
    afterEvaluate {
        def androidExtension = extensions.findByName("android")
        if (androidExtension != null) {
            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }
    }

    configurations.configureEach {
        if (name.startsWith("kapt")) {
            resolutionStrategy.force "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlinVersion"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content {
                includeGroup "com.github.MetrolistGroup.innertubex"
                includeGroup "com.github.MetrolistGroup.quackjs"
                includeGroup "com.github.TeamNewPipe"
            }
        }
    }
}
